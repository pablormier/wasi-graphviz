name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      graphviz_version:
        description: "Graphviz version to bundle (e.g. 15.1.0)"
        required: false
      publish:
        description: "Publish to PyPI (set to 'true' to push)"
        required: false
        default: "false"

jobs:
  build:
    name: Build wasm + wheel
    runs-on: ubuntu-latest
    outputs:
      graphviz_version: ${{ steps.graphviz_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine Graphviz version
        id: graphviz_version
        env:
          GRAPHVIZ_INPUT: ${{ github.event.inputs.graphviz_version || '' }}
        run: |
          if [ -n "$GRAPHVIZ_INPUT" ]; then
            VERSION="$GRAPHVIZ_INPUT"
          else
            VERSION=$(python3 -c "
          import ast, pathlib
          src = pathlib.Path('scripts/build_wasm.py').read_text()
          for line in src.splitlines():
              if line.startswith('GRAPHVIZ_VERSION'):
                  print(ast.literal_eval(line.split('=', 1)[1].strip()))
                  break
          ")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.67.2
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build graphviz.wasm
        run: pixi run build-wasm --graphviz-version "${{ steps.graphviz_version.outputs.version }}"

      - name: Confirm wasm vendored into package
        run: |
          test -f src/wasi_graphviz/assets/graphviz.wasm
          ls -lh src/wasi_graphviz/assets/graphviz.wasm

      - name: Run tests against built wasm
        run: |
          uv sync --all-extras
          uv run pytest -q

      - name: Build wheel + sdist
        run: uv build

      - name: Show distribution
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphviz-wasm-${{ steps.graphviz_version.outputs.version }}
          path: src/wasi_graphviz/assets/graphviz.wasm
          if-no-files-found: error

  github-release:
    name: Attach to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: graphviz-wasm-${{ needs.build.outputs.graphviz_version }}
          path: wasm

      - name: Derive package version
        id: version
        run: echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            wasm/graphviz.wasm
          body: |
            wasi-graphviz ${{ steps.version.outputs.package_version }}

            Bundles Graphviz ${{ needs.build.outputs.graphviz_version }} compiled to wasm32-wasi.

            Install:
            ```bash
            pip install wasi-graphviz[all]==${{ steps.version.outputs.package_version }}
            ```

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wasi-graphviz
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
